# Firewall TUI configuration
# Copy this file and adjust the paths for your environment.

[firewall]
# Base directory containing the per-host firewall rulesets
dir = /home/cdist/config/files/firewall

# Directory for [#include] files (defaults to dir when empty)
includedir =

# Path to the shared db file (defaults to dir/db when empty)
db =

# Directory with the last explorer data per host, e.g. /home/cdist/explore.
# When set, the rule editor shows a dropdown of the host's network
# interfaces (from <explore_dir>/<host>/interfaces) for the Iface field.
# Leave empty to keep the Iface field a plain text input.
explore_dir =

# Directory of the __firewall cdist type. The 'p' preview runs its manifest
# in generate-only mode (FWTUI_GENERATE) so the preview shows exactly what
# the type would deploy.
firewall_type = /home/cdist/files.external/cdist-types.git/__firewall

# Command to install a firewall for a host. {host} is replaced with the
# target hostname. Use -n for a dry run.
deploy_command = /home/cdist/cdist/bin/cdist config -n -c /home/cdist/config {host}

[environment]
# Environment variables for the deploy command
CDIST_BETA = 1
CDIST_INSTALL = /home/cdist/cdist
CDIST_EXPLORE = /home/cdist/explore
CDIST_INVENTORY = /home/cdist/.cdist/inventory
CDIST_CONFIG_DIR = /home/cdist/config
